service: soaprequest-service
container:
  replicas: 1
readinessProbe:
  httpGet:
    path: /admin/health-check
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 5
config:
  JDK_JAVA_OPTIONS: "-XX:+UseG1GC -XX:MaxRAMPercentage=60.0"
resources:
  requests:
    cpu: 250m
    memory: 1.5Gi
  limits:
    memory: 1.5Gi
database:
  enabled: true
  workloadIdentity:
    enabled: true
  databaseNames: ["soaprequest-microservice"]
  migrations:
    enabled: true
externalSecret:
  enabled: true
  refreshInterval: 1h
  secrets:
    - secretKey: BASE_SERVICE_DB_PASSWORD
      remoteKey: legacyDatabasePassword1
    - secretKey: NEW_BASE_SERVICE_DB_PASSWORD
      remoteKey: legacyDatabasePassword2
